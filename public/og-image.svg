  <!-- Decorative hearts -->
  <path d="M200 315 C200 315 185 300 185 285 C185 275 195 268 210 268 C220 268 200 285 200 285 C200 285 180 268 190 268 C205 268 215 275 215 285 C215 300 200 315 200 315 Z"
