  <path d="M1000 315 C1000 315 985 300 985 285 C985 275 995 268 1010 268 C1020 268 1000 285 1000 285 C1000 285 980 268 990 268 C1005 268 1015 275 1015 285 C1015 300 1000 315 1000 315 Z"
