<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" routerLink="/dashboard">WedInv</a>

    <button class="navbar-toggler" type="button" (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">
            <i class="bi bi-house me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/matrimonio" routerLinkActive="active"
            (click)="closeMenu()">
            <i class="bi bi-heart me-1"></i>Matrimonio
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/invitati" routerLinkActive="active"
            (click)="closeMenu()">
            <i class="bi bi-people me-1"></i>Invitati
          </a>
        </li>
        @if (isPremium()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/lista-nozze" routerLinkActive="active"
              (click)="closeMenu()">
              <i class="bi bi-gift me-1"></i>Lista Nozze
            </a>
          </li>
        }
      </ul>

      <ul class="navbar-nav align-items-center">
        @if (isAuthenticated() && !isPremium()) {
          <li class="nav-item me-3">
            <a class="btn btn-premium" routerLink="/pagamento" (click)="closeMenu()">
              <i class="bi bi-star-fill me-1"></i>Passa a Premium
            </a>
          </li>
        }
        <li class="nav-item me-2">
          <button class="btn btn-link nav-link theme-toggle" (click)="toggleLightDark()"
            [title]="isDarkTheme() ? 'Passa al tema chiaro' : 'Passa al tema scuro'">
            @if (isDarkTheme()) {
              <i class="bi bi-moon-fill"></i>
            } @else {
              <i class="bi bi-sun-fill"></i>
            }
          </button>
        </li>
        <li class="nav-item dropdown" [class.show]="isDropdownOpen">
          <a class="nav-link dropdown-toggle" href="#" role="button"
            (click)="toggleDropdown($event)"
            [attr.aria-expanded]="isDropdownOpen">
            <i class="bi bi-person-circle me-1"></i>{{ userName() }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end" [class.show]="isDropdownOpen">
            <li>
              <a class="dropdown-item" routerLink="/stili" (click)="closeDropdown(); closeMenu()">
                <i class="bi bi-palette me-2"></i>Stili
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <button class="dropdown-item text-danger" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Esci
              </button>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
