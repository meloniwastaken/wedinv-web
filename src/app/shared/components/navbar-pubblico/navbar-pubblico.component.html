<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" [routerLink]="['/invito', invitatoId]">WedInv</a>

    <button class="navbar-toggler" type="button" (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/invito', invitatoId]" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">
            <i class="bi bi-envelope-heart me-1"></i>Il mio Invito
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/invito', invitatoId, 'matrimonio']" routerLinkActive="active"
            (click)="closeMenu()">
            <i class="bi bi-heart me-1"></i>Matrimonio
          </a>
        </li>
        @if (showListaNozze) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="['/invito', invitatoId, 'lista-nozze']" routerLinkActive="active"
              (click)="closeMenu()">
              <i class="bi bi-gift me-1"></i>Lista Nozze
            </a>
          </li>
        }
        @if (showIban) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="['/invito', invitatoId, 'iban']" routerLinkActive="active"
              (click)="closeMenu()">
              <i class="bi bi-credit-card me-1"></i>IBAN
            </a>
          </li>
        }
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/invito', invitatoId, 'foto']" routerLinkActive="active"
            (click)="closeMenu()">
            <i class="bi bi-images me-1"></i>Foto
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contatti" routerLinkActive="active"
            (click)="closeMenu()">
            <i class="bi bi-envelope me-1"></i>Contattaci
          </a>
        </li>
      </ul>

      <ul class="navbar-nav align-items-center">
        <li class="nav-item me-2">
          <button class="btn btn-link nav-link theme-toggle" (click)="toggleLightDark()"
            [title]="isDarkTheme() ? 'Passa al tema chiaro' : 'Passa al tema scuro'">
            @if (isDarkTheme()) {
              <i class="bi bi-moon-fill"></i>
            } @else {
              <i class="bi bi-sun-fill"></i>
            }
          </button>
        </li>
        @if (nomeInvitato) {
          <li class="nav-item">
            <span class="nav-link">
              <i class="bi bi-person-circle me-1"></i>{{ nomeInvitato }}
            </span>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
